[project]
name = "automatio-agentica"
version = "2.1.0"
description = "Harness-driven video production pipeline: script + plan -> Hindi and English long-form videos (Manim animation, house voices, separate subtitles)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "manim>=0.19",
    "edge-tts>=7.0",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.scripts]
automatio = "automatio.cli:main"

[tool.setuptools]
packages = ["automatio", "automatio.providers", "agentic_video"]
